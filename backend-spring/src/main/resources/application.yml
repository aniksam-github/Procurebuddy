spring:
  application:
    name: procurebuddy-backend
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:120000}
  cache:
    type: simple
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./procurebuddy-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      pool-name: ProcureBuddyHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
  error:
    whitelabel:
      enabled: false

procurebuddy:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  admin-email: ${PROCUREBUDDY_ADMIN_EMAIL:aniksam2000@outlook.com}
  data-dir: ${PROCUREBUDDY_DATA_DIR:../data}
  repo-root: ${PROCUREBUDDY_REPO_ROOT:..}
  python-executable: ${PROCUREBUDDY_PYTHON:}
  python-bridge-script: ${PROCUREBUDDY_PYTHON_BRIDGE:python_bridge.py}
  ai-timeout-seconds: ${PROCUREBUDDY_AI_TIMEOUT_SECONDS:90}
  async:
    core-pool-size: ${PROCUREBUDDY_ASYNC_CORE_POOL_SIZE:16}
    max-pool-size: ${PROCUREBUDDY_ASYNC_MAX_POOL_SIZE:32}
    queue-capacity: ${PROCUREBUDDY_ASYNC_QUEUE_CAPACITY:400}
    thread-name-prefix: ${PROCUREBUDDY_ASYNC_THREAD_NAME_PREFIX:procurebuddy-async-}
