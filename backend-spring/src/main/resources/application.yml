spring:
  application:
    name: procurebuddy-backend
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:120000}
  cache:
    type: simple
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/procurebuddy}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:procurebuddy}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change_this_strong_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      pool-name: ProcureBuddyHikariPool
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
  error:
    whitelabel:
      enabled: false

procurebuddy:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://13.232.193.6:3000}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://13.232.193.6:*}
  admin-email: ${PROCUREBUDDY_ADMIN_EMAIL:${ADMIN_EMAIL:admin@example.com}}
  data-dir: ${PROCUREBUDDY_DATA_DIR:../data}
  repo-root: ${PROCUREBUDDY_REPO_ROOT:..}
  python-service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-seconds: ${AI_SERVICE_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${AI_SERVICE_READ_TIMEOUT_SECONDS:180}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:720}
    challenge-token-minutes: ${JWT_CHALLENGE_TOKEN_MINUTES:10}
  python-executable: ${PROCUREBUDDY_PYTHON:}
  python-bridge-script: ${PROCUREBUDDY_PYTHON_BRIDGE:python_bridge.py}
  ai-timeout-seconds: ${PROCUREBUDDY_AI_TIMEOUT_SECONDS:90}
  async:
    core-pool-size: ${PROCUREBUDDY_ASYNC_CORE_POOL_SIZE:16}
    max-pool-size: ${PROCUREBUDDY_ASYNC_MAX_POOL_SIZE:32}
    queue-capacity: ${PROCUREBUDDY_ASYNC_QUEUE_CAPACITY:400}
    thread-name-prefix: ${PROCUREBUDDY_ASYNC_THREAD_NAME_PREFIX:procurebuddy-async-}


